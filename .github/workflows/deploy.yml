name: Deploy API to Linode

on:
  push:
    branches:
      - main
      # - dev

env:
  NODE_VERSION: 20
  REMOTE_USER: user_toppingfly
  REMOTE_HOST: 172.238.203.241
  REMOTE_DIR: /home/user_toppingfly/apps/api_toppingfly/

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout del repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Compilar TypeScript
      - name: Build project
        run: npm run build

      # 5️⃣ Configurar SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 6️⃣ Agregar servidor a known_hosts
      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ env.REMOTE_HOST }} >> ~/.ssh/known_hosts

      # 7️⃣ Deploy del build y archivos necesarios
      - name: Deploy via rsync
        run: |
          echo "Deploying API to server..."

          rsync -avz --delete \
            ${{ github.workspace }}/dist/ \
            ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }}:${{ env.REMOTE_DIR }}dist/

          rsync -avz \
            package.json \
            package-lock.json \
            ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }}:${{ env.REMOTE_DIR }}

      # 8️⃣ Instalar dependencias de producción y reiniciar PM2
      - name: Restart PM2
        run: |
          echo "Reloading API..."

          ssh ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }} \
            "cd ${{ env.REMOTE_DIR }} && npm install --omit=dev && pm2 restart api_toppingly --update-env"
