name: Deploy to Linode

on:
  push:
    branches:
      - main
      # - dev

env:
  REMOTE_USER: user_toppingfly
  REMOTE_HOST: 172.238.203.241
  REMOTE_DIR: /home/user_toppingfly/apps/api_toppingfly/

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Configurar SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3️⃣ Agregar servidor a known_hosts
      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ env.REMOTE_HOST }} >> ~/.ssh/known_hosts

      # 4️⃣ Deploy según la rama
      - name: Deploy to Linode
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Deploying branch: ${BRANCH_NAME}"

          if [ "${BRANCH_NAME}" = "main" ]; then
            echo "🚀 Deploy a PRODUCCIÓN"
            ssh ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }} \
              "bash ~/scripts/deploy.sh"
          elif [ "${BRANCH_NAME}" = "dev" ]; then
            echo "🧪 Deploy a DESARROLLO"
            ssh ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }} \
              "bash ~/scripts/deploy_dev.sh"
          else
            echo "❌ Rama no soportada: ${BRANCH_NAME}"
            exit 1
          fi